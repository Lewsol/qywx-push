version: '3'

services:
  wechat-notifier:
    build: .
    container_name: wechat-notifier
    restart: unless-stopped
    ports:
      - "12121:12121"
    volumes:
      - ./database:/app/database
    environment:
      PORT: 12121
      DB_PATH: /app/database/notifier.db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?必须通过外部环境或部署平台密钥管理注入ENCRYPTION_KEY}
      NODE_ENV: production
      WECHAT_API_BASE: https://qyapi.weixin.qq.com